name: Build and Deploy Docker App to EC2 (ECR)

on:
  push:
    branches:
      - feature/docker-ci

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials (for ECR push)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Login to ECR (CI side)
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin \
          012514677626.dkr.ecr.ap-south-1.amazonaws.com

      # 4. Build image
      - name: Build Docker image
        run: |
          docker build -t node-app .

      # 5. Tag image for ECR
      - name: Tag Docker image for ECR
        run: |
          docker tag node-app:latest \
          012514677626.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest

      # 6. Push image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
          012514677626.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest

      # 7. Deploy on EC2 (pull from ECR)
      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
              aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin \
              012514677626.dkr.ecr.ap-south-1.amazonaws.com

              docker stop node-app || true
              docker rm node-app || true

              docker pull 012514677626.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest

              docker run -d \
                --name node-app \
                -p 3000:3000 \
                --restart=always \
                012514677626.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest
          EOF

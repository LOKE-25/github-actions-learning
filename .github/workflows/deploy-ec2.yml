name: Build and Deploy Docker App to EC2

on:
  push:
    branches:
      - feature/docker-ci

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t luckyy725/node-app-image:latest .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push luckyy725/node-app-image:latest

      # 5. Deploy to EC2 (stop → remove → pull → run)
      - name: Deploy Docker container on EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
              docker stop node-app || true
              docker rm node-app || true
              docker pull luckyy725/node-app-image:latest
              docker run -d \
                --name node-app \
                -p 3000:3000 \
                --restart=always \
                luckyy725/node-app-image:latest
          EOF
